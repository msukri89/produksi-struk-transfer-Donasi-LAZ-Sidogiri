<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bukti Donasi • LAZ Sidogiri</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e5d59">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        @font-face {
            font-family: 'Gilroy-Bold';
            src: url('Gilroy-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --green: #1e6466;
            --green-dark: #174f50;
            --orange: #f36b2c;
            --ink: #202826;
            --muted: #7b8582;
            --surface: #ffffff;
            --line: #e9eeec;
            --soft: rgba(255,255,255,.12);
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f6f5;
            color: var(--ink);
            user-select: none;
            -webkit-user-select: none;
        }

        #appHeader {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: var(--green);
            border-bottom: 0;
            z-index: 150;
        }
        .brand { display:flex; align-items:center; gap:10px; min-width:0; }
        .brand-mark {
            width:38px; height:38px; border-radius:11px;
            display:grid; place-items:center;
            background:rgba(255,255,255,.14);
            color:#fff; font-family:'Gilroy-Bold',sans-serif; font-size:17px;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
        }
        .brand-copy { min-width:0; }
        .brand-title { font-weight:700; font-size:15px; line-height:1.1; letter-spacing:-.2px; color:#fff; }
        .brand-sub { display:none; }
        .status {
            width:30px; height:30px;
            display:grid; place-items:center;
            background:rgba(255,255,255,.10);
            border:1px solid rgba(255,255,255,.16);
            border-radius:50%;
            padding:0;
        }
        .status-dot { width:7px; height:7px; border-radius:50%; background:#35b47a; box-shadow:0 0 0 4px rgba(53,180,122,.10); }
        .status-text { display:none; }
        .header-actions { display:flex; align-items:center; gap:6px; }
        .header-edit {
            width:40px; height:40px; border:0; border-radius:50%;
            background:transparent; color:#fff; display:grid; place-items:center;
            cursor:pointer; padding:0;
            transition:opacity .16s, transform .16s;
        }
        .header-edit:hover { opacity:.78; }
        .header-edit:active { transform:scale(.92); }
        .header-edit:disabled { opacity:.42; }
        .header-edit.reset { color:#fff; }
        .header-edit svg {
            display:block; width:22px; height:22px;
            stroke:currentColor; fill:none; stroke-width:1.9;
            stroke-linecap:round; stroke-linejoin:round;
        }
        .header-edit-label { display:none; }
        .header-save {
            width:40px; height:40px; border:0; border-radius:50%;
            background:transparent; color:#fff;
            display:grid; place-items:center; padding:0;
            text-decoration:none; cursor:pointer;
            transition:opacity .16s, transform .16s;
        }
        .header-save:hover { opacity:.78; }
        .header-save:active { transform:scale(.92); }
        .header-save svg {
            display:block; width:22px; height:22px;
            stroke:currentColor; fill:none; stroke-width:1.9;
            stroke-linecap:round; stroke-linejoin:round;
        }


        #workspace {
            position:absolute; top:66px; left:0; right:0; bottom:86px;
            overflow:hidden; touch-action:none;
            background:#f4f6f5;
            background-image:radial-gradient(#dce3e1 .8px,transparent .8px);
            background-size:24px 24px;
        }
        canvas {
            position:absolute; top:0; left:0; transform-origin:0 0;
            box-shadow:0 10px 28px rgba(32,40,38,.12);
            border-radius:2px;
            touch-action:none;
        }


        #toast {
            position:absolute; top:78px; left:50%; transform:translateX(-50%);
            background:rgba(24,35,33,.88); color:#fff; padding:9px 14px;
            border-radius:999px; font-size:11px; pointer-events:none;
            opacity:1; transition:opacity .5s; z-index:200;
            box-shadow:0 8px 24px rgba(0,0,0,.14);
        }

        #toolbar {
            position:absolute; bottom:0; left:0; right:0; height:86px;
            background:var(--green);
            display:flex; overflow-x:auto; white-space:nowrap;
            padding:7px 10px; align-items:center; gap:2px;
            border-top:0; z-index:100;
        }
        #toolbar::-webkit-scrollbar { display:none; }
        .tool-btn {
            flex:0 0 auto; display:flex; flex-direction:column;
            align-items:center; justify-content:center; width:72px; height:72px;
            border:0; background:transparent; font-size:11px; cursor:pointer;
            color:rgba(255,255,255,.86); font-weight:600; transition:background .16s,color .16s,transform .16s;
            border-radius:12px;
        }
        .tool-btn:hover { color:#fff; }
        .tool-btn.active { color:#fff; }
        .tool-btn:active { transform:scale(.96); }
        .tool-btn .icon {
            display:grid; place-items:center; width:34px; height:34px;
            margin-bottom:4px; font-size:0;
        }
        .tool-btn .icon svg {
            width:26px; height:26px;
            stroke:currentColor; fill:none;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
        }


        .panel {
            position:absolute; bottom:94px; left:12px; right:12px;
            background:#fff; padding:16px;
            border:1px solid var(--line);
            border-radius:16px; box-shadow:0 14px 35px rgba(32,40,38,.14);
            display:none; z-index:99; transform:translateY(8px); opacity:0;
            transition:.18s ease; max-height:62vh; overflow-y:auto;
        }
        .panel.show { display:block; transform:translateY(0); opacity:1; }
        .panel-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:14px; padding-bottom:11px; border-bottom:1px solid var(--line);
        }
        .panel-header h3 { margin:0; font-size:14px; color:var(--ink); font-weight:750; }
        .close-btn {
            width:30px; height:30px; border:0; border-radius:9px;
            background:var(--soft); color:#7a8581; cursor:pointer; font-size:19px;
            line-height:1;
        }

        label { display:block; font-size:11px; font-weight:700; margin-bottom:7px; color:#68736f; }
        input[type="file"], input[type="text"], select {
            width:100%; padding:11px 12px; margin-bottom:13px;
            border:1px solid #e1e7e5; border-radius:10px; font-size:14px;
            background:#fafbfb; outline:none; color:var(--ink);
        }
        input[type="text"]:focus, select:focus { border-color:#7aa9a4; box-shadow:0 0 0 3px rgba(31,102,97,.07); }
        input[type="range"] { width:100%; accent-color:var(--green); margin-bottom:13px; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .btn-action {
            background:var(--green); color:#fff; border:0; padding:11px;
            border-radius:10px; cursor:pointer; font-weight:700; width:100%;
            margin-bottom:8px; font-size:12px;
        }
        .btn-action:hover { background:var(--green-dark); }
        .btn-danger { background:#b95a5a; }

        @media (min-width: 800px) {
            #toolbar { padding-left:20px; padding-right:20px; }
            .panel { left:20px; right:auto; width:370px; }
        }
        @media (max-width: 520px) {
            .brand-title { font-size:14px; }
            .tool-btn { width:20%; min-width:0; }
        }
    </style></head>
<body>
    <header id="appHeader">
        <div class="brand">
            <div class="brand-mark" aria-label="LAZ Sidogiri">L</div>
            <div class="brand-copy">
                <div class="brand-title">Bukti Donasi</div>
                <div class="brand-sub">Produksi Konten • LAZ Sidogiri</div>
            </div>
        </div>
        <div class="header-actions">
            <button id="btnUndo" class="header-edit" title="Urungkan perubahan" aria-label="Urungkan perubahan" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 6 6v1"/></svg>
            </button>
            <button id="btnReset" class="header-edit reset" title="Reset editor" aria-label="Reset editor">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-9.94L3 8"/></svg>
            </button>
            <a id="downloadBtn" class="header-save" style="display:none;" download="Bukti_Donasi.jpg" title="Simpan Bukti" aria-label="Simpan Bukti">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </a>
            <div class="status"><span class="status-dot"></span><span class="status-text">Siap digunakan</span></div>
        </div>
    </header>

    <!-- Indikator Panduan -->
    <div id="toast">Cubit latar untuk Zoom & Geser</div>

    <!-- Area Kanvas -->
    <div id="workspace">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Panel 1: Template -->
    <div id="panel-template" class="panel">
        <div class="panel-header">
            <h3>Pilih Template</h3>
            <button class="close-btn" onclick="closePanels()">×</button>
        </div>
        <select id="selectTemplate">
            <option value="loading">Memindai template...</option>
        </select>
        <input type="file" id="uploadTemplate" accept="image/*" style="display: none; margin-top: 10px;">
    </div>

    <!-- Panel 2: Struk -->
    <div id="panel-struk" class="panel">
        <div class="panel-header">
            <h3>Upload Bukti Transfer</h3>
            <button class="close-btn" onclick="closePanels()">×</button>
        </div>
        <input type="file" id="uploadStruk" accept="image/*">
        <p style="font-size: 12px; color: #666; margin-top: 0;">*Setelah upload, ketuk gambar struk di kanvas untuk mengatur posisi dan ukurannya.</p>
    </div>

    <!-- Panel 3: Nominal -->
    <div id="panel-nominal" class="panel">
        <div class="panel-header">
            <h3>Edit Nominal</h3>
            <button class="close-btn" onclick="closePanels()">×</button>
        </div>
        <input type="text" id="inputNominal" value="500.000">
    </div>

    <!-- Panel 4: Crop -->
    <div id="panel-crop" class="panel">
        <div class="panel-header">
            <h3>Potong Struk</h3>
            <button class="close-btn" onclick="closePanels()">×</button>
        </div>
        <div class="grid-2">
            <div><label>Atas</label><input type="range" id="cropT" min="0" max="50" value="0"></div>
            <div><label>Bawah</label><input type="range" id="cropB" min="0" max="50" value="0"></div>
            <div><label>Kiri</label><input type="range" id="cropL" min="0" max="50" value="0"></div>
            <div><label>Kanan</label><input type="range" id="cropR" min="0" max="50" value="0"></div>
        </div>
    </div>

    <!-- Panel 5: Sensor/Blur -->
    <div id="panel-sensor" class="panel">
        <div class="panel-header">
            <h3>Sensor Privasi</h3>
            <button class="close-btn" onclick="closePanels()">×</button>
        </div>
        <button id="btnAddSensor" class="btn-action">+ Tambah Area Sensor</button>
        <button id="btnDelSensor" class="btn-action btn-danger" style="display:none;">- Hapus Sensor Terpilih</button>
    </div>

    <!-- Toolbar Bawah -->
    <div id="toolbar">
        <button class="tool-btn" onclick="togglePanel('template')"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>Template</button>
        <button class="tool-btn" onclick="togglePanel('struk')"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2Z"/><path d="M16 8h-6"/><path d="M16 12h-6"/><path d="M16 16h-6"/></svg></span>Struk</button>
        <button class="tool-btn" onclick="togglePanel('nominal')"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></span>Teks</button>
        <button class="tool-btn" onclick="togglePanel('crop')"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></span>Potong</button>
        <button class="tool-btn" onclick="togglePanel('sensor')"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span>Privasi</button>

    </div>

<script>
    // --- 1. PENGATURAN UI (PANEL & TOOLBAR) ---
    function closePanels() {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    }

    function togglePanel(panelId) {
        const panel = document.getElementById('panel-' + panelId);
        const isOpen = panel.classList.contains('show');
        closePanels();
        if (!isOpen) {
            panel.classList.add('show');
            // Menandai tombol aktif (menggunakan urutan tombol)
            event.currentTarget.classList.add('active');
        }
    }

    // Hilangkan toast panduan setelah 4 detik
    setTimeout(() => { document.getElementById('toast').style.opacity = '0'; }, 4000);

    // --- 2. LOGIKA KANVAS & OBJEK ---
    document.fonts.load('10pt "Gilroy-Bold"').then(() => { drawCanvas(); });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let imgTemplate = new Image();
    let imgStruk = new Image();
    
    let templateLoaded = false;
    let strukLoaded = false;
    
    // Objek Data
    let s = { x: 50, y: 200, w: 300, scale: 1 }; 
    let t = { x: 500, y: 400, size: 45 };
    let sensors = [];
    
    // Interaksi Objek
    let activeObj = null; 
    let isDraggingObj = false;
    let isResizingObj = false;
    const handleHitRadius = 40; 
    
    // Interaksi Workspace (Latar/Kanvas)
    let wpZoom = 1;
    let wpPanX = 0;
    let wpPanY = 0;
    let isPanningWp = false;
    let lastClientX, lastClientY;
    
    // Multi-touch State
    let initialPinchDist = null;
    let initialObjScale = null;
    let initWpZoom = null;
    let initPanX = null;
    let initPanY = null;
    let initCenterX = null;
    let initCenterY = null;

    // --- UNDO / RESET ---
    const history = [];
    const MAX_HISTORY = 30;
    let historyLock = false;

    function getEditorState() {
        return {
            s: { ...s },
            t: { ...t },
            sensors: sensors.map(sensor => ({ ...sensor })),
            cropT: document.getElementById('cropT').value,
            cropB: document.getElementById('cropB').value,
            cropL: document.getElementById('cropL').value,
            cropR: document.getElementById('cropR').value,
            nominal: document.getElementById('inputNominal').value,
            activeObj,
            strukSrc: imgStruk.src || '',
            strukLoaded
        };
    }

    function updateHistoryButtons() {
        const btn = document.getElementById('btnUndo');
        if (btn) btn.disabled = history.length === 0;
    }

    function recordHistory() {
        if (historyLock) return;
        const snapshot = getEditorState();
        const last = history[history.length - 1];
        if (last && JSON.stringify(last) === JSON.stringify(snapshot)) return;
        history.push(snapshot);
        if (history.length > MAX_HISTORY) history.shift();
        updateHistoryButtons();
    }

    function restoreState(state) {
        historyLock = true;
        s = { ...state.s };
        t = { ...state.t };
        sensors = state.sensors.map(sensor => ({ ...sensor }));
        document.getElementById('cropT').value = state.cropT;
        document.getElementById('cropB').value = state.cropB;
        document.getElementById('cropL').value = state.cropL;
        document.getElementById('cropR').value = state.cropR;
        document.getElementById('inputNominal').value = state.nominal;
        activeObj = state.activeObj;
        if (state.strukSrc) {
            strukLoaded = true;
            if (imgStruk.src !== state.strukSrc) imgStruk.src = state.strukSrc;
        } else {
            strukLoaded = false;
            imgStruk.removeAttribute('src');
        }
        historyLock = false;
        drawCanvas();
    }

    function undo() {
        if (!history.length) return;
        const state = history.pop();
        restoreState(state);
        updateHistoryButtons();
        const toastEl = document.getElementById('toast');
        toastEl.textContent = 'Perubahan terakhir dibatalkan';
        toastEl.style.opacity = '1';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1600);
    }

    function resetEditor() {
        if (!templateLoaded) return;
        recordHistory();
        s = { x: canvas.width * 0.05, y: canvas.height * 0.15, w: canvas.width * 0.40, scale: 1 };
        t = { x: canvas.width * 0.52, y: canvas.height * 0.40, size: canvas.width * 0.055 };
        sensors = [];
        activeObj = null;
        strukLoaded = false;
        imgStruk.removeAttribute('src');
        document.getElementById('inputNominal').value = '500.000';
        ['cropT', 'cropB', 'cropL', 'cropR'].forEach(id => document.getElementById(id).value = 0);
        centerWorkspace();
        drawCanvas();
    }

    document.getElementById('btnUndo').addEventListener('click', undo);
    document.getElementById('btnReset').addEventListener('click', resetEditor);
    updateHistoryButtons();

    // --- AUTO-DETECT TEMPLATE ---
    function checkTemplateExists(index) {
        return new Promise((resolve) => {
            let img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = `template_${index}.png`;
        });
    }

    async function scanTemplates() {
        let index = 1;
        let options = '';
        while (true) {
            if (await checkTemplateExists(index)) {
                options += `<option value="template_${index}.png">Template ${index}</option>`;
                index++;
            } else { break; }
        }
        if (options === '') options = `<option value="" disabled>Belum ada template</option>`;
        options += `<option value="manual">+ Upload Template Manual...</option>`;
        
        const selectEl = document.getElementById('selectTemplate');
        selectEl.innerHTML = options;
        if (index > 1) { selectEl.value = 'template_1.png'; imgTemplate.src = 'template_1.png'; } 
        else { selectEl.value = 'manual'; document.getElementById('uploadTemplate').style.display = 'block'; }
    }
    scanTemplates();

    document.getElementById('selectTemplate').addEventListener('change', function(e) {
        recordHistory();
        if (e.target.value === 'manual') document.getElementById('uploadTemplate').style.display = 'block';
        else { document.getElementById('uploadTemplate').style.display = 'none'; imgTemplate.src = e.target.value; }
    });
    document.getElementById('uploadTemplate').addEventListener('change', e => { if(e.target.files[0]) imgTemplate.src = URL.createObjectURL(e.target.files[0]); });
    document.getElementById('uploadStruk').addEventListener('change', e => {
        if(e.target.files[0]) {
            recordHistory();
            imgStruk.src = URL.createObjectURL(e.target.files[0]);
        }
        closePanels();
    });
    document.getElementById('inputNominal').addEventListener('focus', recordHistory);
    document.getElementById('inputNominal').addEventListener('input', drawCanvas);
    ['cropT', 'cropB', 'cropL', 'cropR'].forEach(id => {
        document.getElementById(id).addEventListener('pointerdown', recordHistory);
        document.getElementById(id).addEventListener('input', drawCanvas);
    });

    document.getElementById('btnAddSensor').addEventListener('click', () => {
        recordHistory();
        sensors.push({ x: s.x + 20, y: s.y + 20, w: 120, h: 40 });
        activeObj = 'sensor_' + (sensors.length - 1);
        drawCanvas(); closePanels();
    });
    document.getElementById('btnDelSensor').addEventListener('click', () => {
        if (activeObj && activeObj.startsWith('sensor_')) {
            recordHistory();
            sensors.splice(parseInt(activeObj.split('_')[1]), 1);
            activeObj = null; drawCanvas(); closePanels();
        }
    });

    // Menutup panel jika area workspace diklik
    document.getElementById('workspace').addEventListener('mousedown', closePanels);
    document.getElementById('workspace').addEventListener('touchstart', closePanels, {passive: true});

    // --- MENGATUR KANVAS & WORKSPACE ---
    function centerWorkspace() {
        if (!templateLoaded) return;
        const ws = document.getElementById('workspace');
        // Fit gambar ke layar dengan margin 10%
        const ratio = Math.min(ws.clientWidth / canvas.width, ws.clientHeight / canvas.height) * 0.97;
        wpZoom = ratio;
        wpPanX = (ws.clientWidth - (canvas.width * wpZoom)) / 2;
        wpPanY = (ws.clientHeight - (canvas.height * wpZoom)) / 2;
        applyWorkspaceTransform();
    }

    function applyWorkspaceTransform() {
        // Menggunakan CSS transform untuk Zoom dan Geser ruang kerja
        canvas.style.transform = `translate(${wpPanX}px, ${wpPanY}px) scale(${wpZoom})`;
    }

    imgTemplate.onload = function() {
        templateLoaded = true;
        canvas.width = imgTemplate.width;
        canvas.height = imgTemplate.height;
        t.x = canvas.width * 0.52; t.y = canvas.height * 0.40; t.size = canvas.width * 0.055;
        s.x = canvas.width * 0.05; s.y = canvas.height * 0.15;
        centerWorkspace();
        drawCanvas();
    };

    imgStruk.onload = function() {
        strukLoaded = true;
        s.w = canvas.width * 0.40; 
        ['cropT', 'cropB', 'cropL', 'cropR'].forEach(id => document.getElementById(id).value = 0);
        drawCanvas();
    };

    // --- MENGGAMBAR ELEMEN ---
    function getBoundingBox(type) {
        if (type === 'struk' && strukLoaded) {
            let ct = document.getElementById('cropT').value / 100, cb = document.getElementById('cropB').value / 100;
            let cl = document.getElementById('cropL').value / 100, cr = document.getElementById('cropR').value / 100;
            let sw = imgStruk.width * (1 - cl - cr), sh = imgStruk.height * (1 - ct - cb);
            let displayW = s.w * s.scale;
            return { x: s.x, y: s.y, w: displayW, h: displayW * (sh / sw) };
        } else if (type === 'teks') {
            ctx.font = `${t.size}px 'Gilroy-Bold', Arial, sans-serif`;
            return { x: t.x, y: t.y - (t.size * 0.9), w: ctx.measureText("Rp. " + document.getElementById('inputNominal').value).width, h: t.size * 1.2 };
        } else if (type && type.startsWith('sensor_')) {
            return sensors[parseInt(type.split('_')[1])];
        }
        return null;
    }

    function drawCanvas() {
        if (!templateLoaded) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(imgTemplate, 0, 0, canvas.width, canvas.height);

        if (strukLoaded) {
            let ct = document.getElementById('cropT').value / 100, cb = document.getElementById('cropB').value / 100;
            let cl = document.getElementById('cropL').value / 100, cr = document.getElementById('cropR').value / 100;
            let sW = imgStruk.width * (1 - cl - cr), sH = imgStruk.height * (1 - ct - cb);
            let dW = s.w * s.scale, dH = dW * (sH / sW);

            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 20; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
            ctx.drawImage(imgStruk, imgStruk.width * cl, imgStruk.height * ct, sW, sH, s.x, s.y, dW, dH);
            ctx.restore();
        }

        ctx.font = `${t.size}px 'Gilroy-Bold', Arial, sans-serif`;
        ctx.fillStyle = "white";
        ctx.fillText("Rp. " + document.getElementById('inputNominal').value, t.x, t.y);

        sensors.forEach((sensor) => {
            ctx.save(); ctx.beginPath(); ctx.rect(sensor.x, sensor.y, sensor.w, sensor.h); ctx.clip(); 
            ctx.filter = 'blur(12px)'; ctx.drawImage(canvas, 0, 0);
            ctx.filter = 'none'; ctx.fillStyle = 'rgba(200,200,200,0.4)'; ctx.fill(); ctx.restore();
        });

        if (activeObj) {
            let box = getBoundingBox(activeObj);
            if (box) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 2 / wpZoom; ctx.setLineDash([8 / wpZoom, 8 / wpZoom]);
                ctx.strokeRect(box.x, box.y, box.w, box.h);
                ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.setLineDash([]);
                let hSize = 14 / wpZoom;
                ctx.fillRect(box.x + box.w - hSize/2, box.y + box.h - hSize/2, hSize, hSize);
                ctx.restore();
            }
        }

        document.getElementById('btnDelSensor').style.display = (activeObj && activeObj.startsWith('sensor_')) ? 'block' : 'none';
        
        const dlBtn = document.getElementById('downloadBtn');
        dlBtn.style.display = "flex";
        dlBtn.href = canvas.toDataURL("image/jpeg", 0.95);
    }

    // --- SISTEM GESTUR & SENTUHAN (CANVA STYLE) ---
    function getMousePos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = ws.getBoundingClientRect();
        const localX = clientX - rect.left;
        const localY = clientY - rect.top;
        // Koordinat harus dihitung relatif terhadap #workspace,
        // karena canvas berada di bawah header dan transform-nya juga relatif ke workspace.
        return { x: (localX - wpPanX) / wpZoom, y: (localY - wpPanY) / wpZoom };
    }

    function getHitRegion(mouse) {
        if (activeObj) {
            let box = getBoundingBox(activeObj);
            if (box) {
                let hitArea = handleHitRadius / wpZoom;
                if (Math.abs(mouse.x - (box.x + box.w)) <= hitArea && Math.abs(mouse.y - (box.y + box.h)) <= hitArea) return 'resize_handle';
            }
        }
        for (let i = sensors.length - 1; i >= 0; i--) {
            let b = sensors[i];
            if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) return 'sensor_' + i;
        }
        let tB = getBoundingBox('teks');
        if (tB && mouse.x >= tB.x && mouse.x <= tB.x + tB.w && mouse.y >= tB.y && mouse.y <= tB.y + tB.h) return 'teks';
        
        let sB = getBoundingBox('struk');
        if (sB && mouse.x >= sB.x && mouse.x <= sB.x + sB.w && mouse.y >= sB.y && mouse.y <= sB.y + sB.h) return 'struk';
        return null;
    }

    const ws = document.getElementById('workspace');

    function handleStart(e) {
        if (e.touches && e.touches.length === 2) return; // Tangani pinch terpisah
        if (e.target.closest('.panel') || e.target.closest('#toolbar') || e.target.closest('#editControls')) return; // Abaikan klik di menu
        
        let mouse = getMousePos(e);
        let hit = getHitRegion(mouse);

        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;

        if (hit === 'resize_handle') {
            e.preventDefault();
            recordHistory();
            isResizingObj = true;
        } else if (hit) {
            e.preventDefault();
            recordHistory();
            activeObj = hit;
            isDraggingObj = true;
        } else {
            // Jika klik area kosong, deselect objek dan bersiap menggeser latar
            activeObj = null; isPanningWp = true;
            lastClientX = cx; lastClientY = cy;
            ws.style.cursor = 'grab';
        }

        if (hit) {
            startMouseX = mouse.x; startMouseY = mouse.y;
            if (activeObj === 'struk') initialObjScale = s.scale;
            if (activeObj === 'teks') initialObjScale = t.size;
        }
        drawCanvas();
    }

    function handleMove(e) {
        if (e.touches && e.touches.length === 2) return;
        
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;

        if (isPanningWp) {
            e.preventDefault();
            wpPanX += cx - lastClientX;
            wpPanY += cy - lastClientY;
            lastClientX = cx; lastClientY = cy;
            applyWorkspaceTransform();
        } 
        else if (isDraggingObj && activeObj) {
            e.preventDefault();
            let mouse = getMousePos(e);
            let dx = mouse.x - startMouseX; let dy = mouse.y - startMouseY;
            if (activeObj === 'struk') { s.x += dx; s.y += dy; } 
            else if (activeObj === 'teks') { t.x += dx; t.y += dy; }
            else if (activeObj.startsWith('sensor_')) { let id = parseInt(activeObj.split('_')[1]); sensors[id].x += dx; sensors[id].y += dy; }
            startMouseX = mouse.x; startMouseY = mouse.y;
            drawCanvas();
        } 
        else if (isResizingObj && activeObj) {
            e.preventDefault();
            let mouse = getMousePos(e);
            if (activeObj === 'struk') { let nw = mouse.x - s.x; if (nw > 50) s.scale = nw / s.w; } 
            else if (activeObj === 'teks') { t.size = initialObjScale + ((mouse.x - startMouseX) * 0.15); if (t.size < 10) t.size = 10; } 
            else if (activeObj.startsWith('sensor_')) {
                let id = parseInt(activeObj.split('_')[1]);
                sensors[id].w = Math.max(20, mouse.x - sensors[id].x);
                sensors[id].h = Math.max(20, mouse.y - sensors[id].y);
            }
            drawCanvas();
        }
    }

    function handleEnd() {
        isDraggingObj = false; isResizingObj = false; isPanningWp = false;
        initialPinchDist = null; ws.style.cursor = 'default';
    }

    // Pinch Zoom Latar (Mobile) & Scroll Mouse (PC)
    ws.addEventListener('wheel', e => {
        e.preventDefault();
        let zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
        // Jika ada objek aktif, perbesar objek. Jika tidak, perbesar workspace.
        if (activeObj) {
            if (activeObj === 'struk') s.scale *= zoomAmount;
            else if (activeObj === 'teks') t.size *= zoomAmount;
            else if (activeObj.startsWith('sensor_')) { let id = parseInt(activeObj.split('_')[1]); sensors[id].w *= zoomAmount; sensors[id].h *= zoomAmount; }
            drawCanvas();
        } else {
            // Zoom Workspace dengan titik pusat mouse
            let rect = ws.getBoundingClientRect();
            let mx = e.clientX - rect.left; let my = e.clientY - rect.top;
            wpZoom *= zoomAmount;
            wpPanX = mx - (mx - wpPanX) * zoomAmount;
            wpPanY = my - (my - wpPanY) * zoomAmount;
            applyWorkspaceTransform();
        }
    }, {passive: false});

    ws.addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
            e.preventDefault();
            let cx1 = e.touches[0].clientX, cy1 = e.touches[0].clientY;
            let cx2 = e.touches[1].clientX, cy2 = e.touches[1].clientY;
            let dist = Math.hypot(cx1 - cx2, cy1 - cy2);
            const wsRect = ws.getBoundingClientRect();
            let centerClientX = ((cx1 + cx2) / 2) - wsRect.left;
            let centerClientY = ((cy1 + cy2) / 2) - wsRect.top;

            if (initialPinchDist == null) {
                initialPinchDist = dist;
                if (activeObj) {
                    if (activeObj === 'struk') initialObjScale = s.scale;
                    else if (activeObj === 'teks') initialObjScale = t.size;
                    else if (activeObj.startsWith('sensor_')) { let id = parseInt(activeObj.split('_')[1]); initialObjScale = { w: sensors[id].w, h: sensors[id].h }; }
                } else {
                    initWpZoom = wpZoom; initPanX = wpPanX; initPanY = wpPanY;
                    initCenterX = centerClientX; initCenterY = centerClientY;
                }
            } else {
                let scaleFactor = dist / initialPinchDist;
                if (activeObj) {
                    if (activeObj === 'struk') s.scale = initialObjScale * scaleFactor;
                    else if (activeObj === 'teks') t.size = initialObjScale * scaleFactor;
                    else if (activeObj.startsWith('sensor_')) { let id = parseInt(activeObj.split('_')[1]); sensors[id].w = initialObjScale.w * scaleFactor; sensors[id].h = initialObjScale.h * scaleFactor; }
                    drawCanvas();
                } else {
                    wpZoom = initWpZoom * scaleFactor;
                    wpPanX = initCenterX - (initCenterX - initPanX) * scaleFactor;
                    wpPanY = initCenterY - (initCenterY - initPanY) * scaleFactor;
                    applyWorkspaceTransform();
                }
            }
        }
    }, {passive: false});

    // Mendaftarkan Event
    ws.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    ws.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

</script>
</body>
